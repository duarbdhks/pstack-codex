name: Review upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  review:
    name: Report upstream candidates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Preview each component
        run: |
          set -euo pipefail
          mkdir -p upstream-reports
          remote="$(jq -r .remote tools/upstream.json)"
          upstream_sha="$(git ls-remote "$remote" HEAD | awk '{print $1}')"
          if ! [[ "$upstream_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve upstream HEAD"
            exit 1
          fi
          while IFS= read -r component; do
            bun tools/sync.mjs "$component" "$upstream_sha" --json > "upstream-reports/${component}.json"
            status="$(jq -r .status "upstream-reports/${component}.json")"
            count="$(jq '.candidates | length' "upstream-reports/${component}.json")"
            printf '%s: %s (%s changes; pin held)\n' "$component" "$status" "$count" >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" = "needs-review" ]; then
              echo "::notice title=Upstream review required::$component has $count changes awaiting a decision"
            fi
          done < <(jq -r '.components | keys[]' tools/upstream.json)
      - name: Upload candidate reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-candidates
          path: upstream-reports/
          if-no-files-found: error
          retention-days: 14
